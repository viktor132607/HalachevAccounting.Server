name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      HALACHEV_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=ci-only-password;SSL Mode=Disable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install PostgreSQL tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

      - name: Restore
        run: dotnet restore HalachevAccounting.slnx

      - name: Build
        run: dotnet build HalachevAccounting.slnx --configuration Release --no-restore

      - name: Tests
        run: dotnet test HalachevAccounting.Tests/HalachevAccounting.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Docker build
        run: docker build -t halachev-accounting:ci .

      - name: API smoke test
        run: |
          docker run -d --name halachev-api --network host             -e ASPNETCORE_ENVIRONMENT=Production             -e ConnectionStrings__DefaultConnection="$HALACHEV_TEST_POSTGRES"             -e Seed__AdminPassword='CiOnly-Admin123!'             -e Seed__DemoData=false             -e Frontend__Url=https://nhalachev.com             halachev-accounting:ci
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:10000/health/ready; then
              exit 0
            fi
            sleep 2
          done
          docker logs halachev-api
          exit 1

      - name: API diagnostics
        if: failure()
        run: docker logs halachev-api || true
